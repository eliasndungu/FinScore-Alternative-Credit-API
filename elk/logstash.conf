# Logstash pipeline for FinScore audit logs.
#
# Reads JSON-formatted logs from stdin (container stdout → Docker log driver)
# and ships them to Elasticsearch under the "finscore-audit-*" index pattern.
#
# To ship logs from running containers, configure the Docker log driver to
# write to a file and point the input below at that file, or use Filebeat.

input {
  # Accept log lines forwarded by Filebeat or the Docker syslog driver.
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Parse the RFC-3339 timestamp emitted by go.uber.org/zap.
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Tag audit events so they can be routed to a dedicated ODPC index.
  if [log_type] == "audit" {
    mutate { add_tag => ["odpc_audit"] }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "finscore-logs-%{+YYYY.MM.dd}"
  }

  # Duplicate audit events to a separate index for long-term retention
  # (ODPC requires audit records to be kept for at least 5 years).
  if "odpc_audit" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "finscore-audit-%{+YYYY.MM.dd}"
    }
  }
}
